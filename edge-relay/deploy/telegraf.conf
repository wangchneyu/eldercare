[agent]
  interval = "15s"
  round_interval = true
  flush_interval = "15s"
  flush_jitter = "5s"
  metric_batch_size = 1000
  omit_hostname = false

[[inputs.prometheus]]
  urls = ["http://edge-relay:8091/actuator/prometheus"]
  metric_version = 2
  interval = "15s"

[[outputs.influxdb]]
  urls = ["${INFLUXDB_URL}"]
  database = "${INFLUXDB_DATABASE}"
  username = "${INFLUXDB_USER}"
  password = "${INFLUXDB_PASSWORD}"
  skip_database_creation = false
  precision = "s"