%% service identity: consume every device uplink and publish device commands.
{allow, {username, "iot-service"}, subscribe, ["elder/+/+/+/up/#"]}.
{allow, {username, "iot-service"}, publish, ["elder/+/+/+/down/#"]}.

%% Device identity is its deviceId. It may publish only its own uplink and
%% subscribe only its own downlink. No unauthenticated or unmatched operation is allowed.
{allow, all, publish, ["elder/+/+/${username}/up/#"]}.
{allow, all, subscribe, ["elder/+/+/${username}/down/#"]}.
{deny, all}.
