services:
  redis:
    image: redis:7.2-alpine
    container_name: eldercare-redis-iot-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - iot-local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: eldercare-postgres-iot-local
    environment:
      POSTGRES_DB: eldercare_iot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - iot-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eldercare_iot"]
      interval: 5s
      timeout: 3s
      retries: 20

  emqx:
    image: emqx/emqx:5.8.8
    container_name: eldercare-emqx-local
    ports:
      - "1883:1883"
      - "18083:18083"
      - "8084:8083"
    volumes:
      - iot-local-emqx-data:/opt/emqx/data
      - iot-local-emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  iot-local-redis-data:
  iot-local-postgres-data:
  iot-local-emqx-data:
  iot-local-emqx-log:
