# Development-only single-master broker. The host application connects through
# the published loopback ports, so the broker must advertise 127.0.0.1.
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerIP1=127.0.0.1
listenPort=10911
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=false
deleteWhen=04
fileReservedTime=48
flushDiskType=ASYNC_FLUSH
