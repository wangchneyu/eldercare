# ===========================================
# service-iot 开发环境配置
# ===========================================

spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/eldercare_iot?currentSchema=public
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 10000

# MQTT Broker（本地 EMQX Docker）
mqtt:
  broker-url: tcp://localhost:1883
  client-id: iot-service-dev
  username: ${IOT_MQTT_USERNAME:}
  password: ${IOT_MQTT_PASSWORD:}

# RocketMQ（默认本地 Docker；可通过环境变量切换至共享 NameServer）
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}

# 日志级别（开发环境更详细）
logging:
  level:
    com.eldercare.iot: DEBUG
    org.springframework.web: DEBUG
