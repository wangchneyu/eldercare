server:
  port: 8083

spring:
  application:
    name: service-iot
  main:
    web-application-type: reactive
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator
management:
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# MQTT（通用配置，dev 环境覆盖）
mqtt:
  broker-url: tcp://localhost:1883
  client-id: iot-service
  topics:
    - elder/+/+/+/up/+
  qos:
    - 1

# RocketMQ（通用配置，dev 环境覆盖）
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: iot-service-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 3
    retry-times-when-send-async-failed: 3

# care-service 长者校验。C07 的按 elderId 查询契约冻结前，仅允许 Mock。
iot:
  care-validation:
    mock-scenario: ${IOT_CARE_MOCK_SCENARIO:active}

spring.cloud.openfeign:
  client:
    config:
      service-care:
        connect-timeout: 200
        read-timeout: 250
        logger-level: basic

# 日志
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} %logger{36} - %msg%n"
  level:
    com.eldercare.iot: DEBUG
    org.apache.rocketmq: WARN
    org.eclipse.paho: INFO

---

spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:nacos:service-iot.yaml"
