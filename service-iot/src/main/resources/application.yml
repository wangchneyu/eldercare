server:
  port: 8083

spring:
  application:
    name: service-iot
  main:
    web-application-type: reactive
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator
management:
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# MQTT（通用配置，dev 环境覆盖）
mqtt:
  broker-url: tcp://localhost:1883
  client-id: iot-service
  topics:
    - elder/+/+/+/up/+
  qos:
    - 1
  max-past-seconds: ${MQTT_MAX_PAST_SECONDS:86400}
  max-future-seconds: ${MQTT_MAX_FUTURE_SECONDS:300}

# RocketMQ（通用配置，dev 环境覆盖）
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: iot-service-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 3
    retry-times-when-send-async-failed: 3

iot:
  outbox:
    initial-lease-seconds: ${IOT_OUTBOX_INITIAL_LEASE_SECONDS:60}
    retry:
      batch-size: ${IOT_OUTBOX_RETRY_BATCH_SIZE:100}
      fixed-delay-ms: ${IOT_OUTBOX_RETRY_FIXED_DELAY_MS:10000}
      lease-minutes: ${IOT_OUTBOX_RETRY_LEASE_MINUTES:5}
      base-backoff-seconds: ${IOT_OUTBOX_RETRY_BASE_BACKOFF_SECONDS:10}
      max-backoff-seconds: ${IOT_OUTBOX_RETRY_MAX_BACKOFF_SECONDS:300}
    sent-retention-days: ${IOT_OUTBOX_SENT_RETENTION_DAYS:30}
    sent-cleanup:
      batch-size: ${IOT_OUTBOX_SENT_CLEANUP_BATCH_SIZE:500}
      fixed-delay-ms: ${IOT_OUTBOX_SENT_CLEANUP_FIXED_DELAY_MS:3600000}
  idempotency:
    ttl-seconds: ${IOT_IDEMPOTENCY_TTL_SECONDS:86400}
    lock-seconds: ${IOT_IDEMPOTENCY_LOCK_SECONDS:30}
  vital-delivery:
    max-age-hours: ${IOT_VITAL_DELIVERY_MAX_AGE_HOURS:24}
    retry:
      batch-size: ${IOT_VITAL_DELIVERY_RETRY_BATCH_SIZE:100}
      fixed-delay-ms: ${IOT_VITAL_DELIVERY_RETRY_FIXED_DELAY_MS:30000}
      lease-minutes: ${IOT_VITAL_DELIVERY_RETRY_LEASE_MINUTES:5}
      backoff-seconds: ${IOT_VITAL_DELIVERY_RETRY_BACKOFF_SECONDS:300}
    terminal-retention-hours: ${IOT_VITAL_DELIVERY_TERMINAL_RETENTION_HOURS:168}
    cleanup:
      fixed-delay-ms: ${IOT_VITAL_DELIVERY_CLEANUP_FIXED_DELAY_MS:3600000}

# 日志
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} %logger{36} - %msg%n"
  level:
    com.eldercare.iot: DEBUG
    org.apache.rocketmq: WARN
    org.eclipse.paho: INFO

---

spring:
  config:
    activate:
      on-profile: "!test & !dev"
    import: "optional:nacos:service-iot.yaml"
